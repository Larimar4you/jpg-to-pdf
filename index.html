<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Beautiful JPG &rarr; PDF Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h2>JPG &rarr; PDF Converter</h2>

        <label for="fileInput" id="dropArea" class="drop-area">
            <span>Drag &amp; drop JPG files here or click to select ✅</span>
        </label>

            <input 
                type="file" 
                id="fileInput" 
                accept=".jpg,.jpeg,image/jpeg" multiple 
                hidden 
                aria-label="Upload images"
            >

        <p 
        id="errorMessage"
        class="error-message"
        role="alert"
        hidden
        ></p>

        <div id="fileList" class="file-list" aria-live="polite"></div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <button type="button" id="convertBtn">Create PDF</button>
    </main>

    <!-- jsPDF -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Sortable.js -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <!-- Custom JavaScript -->
    <script defer src="script.js"></script>
</body>

</html>
